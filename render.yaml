# Render Blueprint: New + Blueprint in the Render dashboard, pick this repo, deploy.
services:
  - type: web
    name: konta-sou-api
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SNAPSHOT_URL            # gzip'd SQLite snapshot built by scripts/snapshot.sh, attached to a GitHub release
        sync: false
      - key: SCHEDULER
        value: "1"
      - key: ALLOWED_ORIGINS         # the GitHub Pages origin, e.g. https://<user>.github.io
        value: "*"
      - key: OASA_API_URL            # Cloudflare Worker relay (worker/): OASA only answers Greek networks
        value: https://konta-sou.charalambos-mitropoulos.workers.dev/oasa/api/
      - key: MOH_BASE_URL            # same relay for the Ministry of Health rota page
        value: https://konta-sou.charalambos-mitropoulos.workers.dev/moh
      - key: HOSPITALS_URL           # fallback rota file if the relay is down (built by scripts/daily.sh)
        value: https://github.com/chamitro/konta-sou/releases/download/data/hospitals-latest.json
      - key: DATABASE_URL
        value: sqlite:///data/simera.db

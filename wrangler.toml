# Cloudflare Workers config (repo root; the source lives in worker/).
name = "konta-sou"
main = "worker/worker.js"
account_id = "dc22f30429eca410d7e5d097960120ae"
compatibility_date = "2026-01-01"

# Ministry copies for callers outside Greece (the Worker itself runs near its caller; see worker.js).
[[kv_namespaces]]
binding = "CACHE"
id = "198726964edd41038b2d1bef5978b968"

# Keep the API on Render awake (free instances sleep after 15 idle minutes).
[triggers]
crons = ["*/10 * * * *"]
